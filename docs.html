<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="pi-web-ui 使用文档：快速开始、工作台指南、进阶工作流、插件扩展与部署参考。"
    />
    <meta name="color-scheme" content="light dark" />
    <title>使用文档 · pi-web-ui</title>
    <link rel="icon" href="./assets/favicon.svg" />
    <link rel="stylesheet" href="./docs.css" />
    <script type="module" src="./docs.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到正文 / Skip to content</a>
    <header class="site-header">
      <a class="brand" href="./index.html"
        ><span class="logo" aria-hidden="true">π</span>pi-web-ui<span
          class="brand-divider"
        ></span
        ><span data-label="docs">使用文档</span></a
      >
      <nav class="top-nav" aria-label="Primary">
        <a href="./docs.html" class="active" data-label="docs">使用文档</a
        ><a href="#modes-guide" data-label="workflows">工作流</a
        ><a href="#cli-and-env" data-label="reference">参考</a>
      </nav>
      <div class="header-tools">
        <button
          class="search-trigger"
          type="button"
          aria-label="搜索文档 / Search docs"
        >
          <span aria-hidden="true">⌕</span
          ><span data-label="search">搜索文档</span><kbd>Ctrl K</kbd></button
        ><button
          id="language-toggle"
          type="button"
          aria-label="Switch language"
        >
          EN</button
        ><button
          id="theme-toggle"
          type="button"
          aria-label="切换主题 / Toggle theme"
        >
          ◐</button
        ><a
          class="github-link"
          href="https://github.com/xing-shuyin/pi-web-ui"
          target="_blank"
          rel="noreferrer"
          >GitHub ↗</a
        ><button
          id="menu-toggle"
          type="button"
          aria-controls="sidebar"
          aria-expanded="false"
          aria-label="展开导航 / Open navigation"
        >
          ☰
        </button>
      </div>
    </header>
    <button
      class="nav-backdrop"
      aria-label="关闭导航 / Close navigation"
      hidden
    ></button>
    <div class="layout">
      <nav id="sidebar" class="sidebar" aria-label="Documentation"></nav>
      <main id="main" tabindex="-1"></main>
      <aside class="toc" aria-label="On this page"></aside>
    </div>
    <dialog id="search-dialog" aria-label="搜索文档 / Search documentation">
      <div class="search-input-wrap">
        <span aria-hidden="true">⌕</span
        ><input
          id="search-input"
          type="search"
          autocomplete="off"
          aria-label="搜索文档 / Search docs"
        /><button
          data-close="search-dialog"
          type="button"
          aria-label="关闭搜索 / Close search"
        >
          Esc
        </button>
      </div>
      <div id="search-results" class="search-results"></div>
      <div class="search-footer">
        <span data-label="searchHint">搜索全部文档、配置参数和工具</span
        ><span>↑ ↓ · Enter · Esc</span>
      </div>
    </dialog>
    <dialog id="image-dialog" aria-label="图片预览 / Image preview">
      <button
        data-close="image-dialog"
        type="button"
        aria-label="关闭图片 / Close image"
      >
        ×</button
      ><img alt="" />
      <p></p>
    </dialog>
    <div class="toast" role="status" aria-live="polite"></div>
    <noscript
      ><p class="noscript">
        文档需要启用 JavaScript。You need JavaScript to read the documentation.
        <a href="https://github.com/xing-shuyin/pi-web-ui#readme"
          >查看 GitHub README / Read on GitHub ↗</a
        >
      </p></noscript
    >
  </body>
</html>
